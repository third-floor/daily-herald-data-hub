<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Elements Workbench</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e6e5e0;
  --border:#dedcd5; --border-strong:#c9c7bf;
  --text:#1a1a19; --text-2:#52514e; --text-3:#76756f;
  --accent:#2a78d6; --accent-soft:#e3eefb; --accent-ink:#1c5cab;
  --grpA:#2a78d6; --grpB:#eb6834; --grpA-soft:#dbe8f9; --grpB-soft:#fbe3d8;
  --good:#0ca30c; --warn:#b77f00; --bad:#d03b3b;
  --seq-0:#f3f7fd; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2e2e2b;
    --border:#34342f; --border-strong:#46463f;
    --text:#f2f1ec; --text-2:#c3c2b7; --text-3:#9a998f;
    --accent:#5598e7; --accent-soft:#1d2d44; --accent-ink:#86b6ef;
    --grpA:#3987e5; --grpB:#d95926; --grpA-soft:#1d2d44; --grpB-soft:#3d2418;
    --good:#2fbf2f; --warn:#fab219; --bad:#e66767;
    --seq-0:#1e2530; --seq-1:#104281; --seq-2:#184f95; --seq-3:#1c5cab; --seq-4:#2a78d6; --seq-5:#5598e7; --seq-6:#86b6ef; --seq-7:#cde2fb;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2e2e2b;
  --border:#34342f; --border-strong:#46463f;
  --text:#f2f1ec; --text-2:#c3c2b7; --text-3:#9a998f;
  --accent:#5598e7; --accent-soft:#1d2d44; --accent-ink:#86b6ef;
  --grpA:#3987e5; --grpB:#d95926; --grpA-soft:#1d2d44; --grpB-soft:#3d2418;
  --good:#2fbf2f; --warn:#fab219; --bad:#e66767;
  --seq-0:#1e2530; --seq-1:#104281; --seq-2:#184f95; --seq-3:#1c5cab; --seq-4:#2a78d6; --seq-5:#5598e7; --seq-6:#86b6ef; --seq-7:#cde2fb;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-3)} .dim{color:var(--text-2)}
.hidden{display:none!important}

/* ── top bar ─────────────────────────────── */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{font-weight:400;color:var(--text-3);margin-left:6px}
.dataset-pill{max-width:340px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.spacer{flex:1}
@media (max-width:640px){.topbar-inner,.filterbar-inner,.tabs,main{padding-left:16px;padding-right:16px}.brand{white-space:normal;font-size:14px}.dataset-pill{max-width:100%}.search-wrap{flex-basis:100%;max-width:none}.fselect{flex:1 1 40%;max-width:none}}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* ── filter bar ──────────────────────────── */
.filterbar{border-top:1px solid var(--border);background:var(--surface)}
.filterbar-inner{max-width:1400px;margin:0 auto;padding:8px 20px;display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1 1 280px;max-width:420px}
.search-wrap input{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 10px 6px 30px}
.search-wrap::before{content:"⌕";position:absolute;left:10px;top:4px;color:var(--text-3);font-size:16px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:40}
.suggest .sg-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:6px 10px 2px}
.suggest .sg-i{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.suggest .sg-i:hover,.suggest .sg-i.act{background:var(--accent-soft)}
.fselect{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:5px 8px;max-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid transparent}
.chip b{font-weight:600}
.chip .x{border:0;background:transparent;cursor:pointer;border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;color:inherit}
.chip .x:hover{background:rgba(0,0,0,.1)}
.chip.B{background:var(--grpB-soft);color:var(--text)}
.lane{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 6px;border-radius:8px;border:1px dashed transparent;cursor:pointer}
.lane.active{border-color:var(--border-strong);background:var(--surface-2)}
.lane-tag{font-weight:700;font-size:12px;border-radius:5px;padding:1px 7px;color:#fff}
.lane-tag.A{background:var(--grpA)} .lane-tag.B{background:var(--grpB)}
.lane .count{font-size:12px;color:var(--text-2)}
.empty-chip{font-size:12px;color:var(--text-3)}

/* ── tabs ────────────────────────────────── */
.tabs{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--border)}
.tab{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-size:11px;color:var(--text-3);margin-left:4px}

/* ── layout ──────────────────────────────── */
main{max-width:1400px;margin:0 auto;padding:18px 20px 80px}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.view-head h1{font-size:20px;margin:0;font-weight:650}
.view-head p{margin:2px 0 0;color:var(--text-2);max-width:760px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:980px){.g2,.g3,.g-2-1{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card h2{font-size:14.5px;margin:0 0 2px;font-weight:620}
.card .sub{font-size:12.5px;color:var(--text-3);margin:0 0 10px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-head .ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.takeaway{font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:7px;padding:6px 10px;margin:8px 0 0}
details.more{margin-top:14px;border-top:1px solid var(--border);padding-top:8px}
details.more>summary{cursor:pointer;color:var(--text-2);font-size:13px;font-weight:550;list-style:none}
details.more>summary::before{content:"▸ ";color:var(--text-3)}
details.more[open]>summary::before{content:"▾ "}
details.more>summary::-webkit-details-marker{display:none}
.section-title{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin:26px 0 8px;font-weight:600}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--text-3)}
.kpi .v .b{color:var(--grpB)} .kpi .v .a{color:var(--grpA)}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{border-color:var(--border-strong)}

/* bar list */
.bars{display:flex;flex-direction:column;gap:1px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:8px;padding:2px 4px;border-radius:5px;cursor:pointer;font-size:13px}
.bar-row:hover{background:var(--surface-2)}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{position:relative;height:16px}
.bar-row .fill{position:absolute;left:0;top:3px;height:10px;border-radius:0 4px 4px 0;background:var(--grpA);min-width:2px}
.bar-row .fill.B{top:9px;height:6px;background:var(--grpB)}
.bar-row.paired .fill.A{top:1px;height:6px}
.bar-row .val{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:12px;min-width:48px;text-align:right}
.bar-row .fill.muted{background:var(--border-strong)}
.div-row{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:8px;align-items:center;padding:2px 4px;border-radius:5px;cursor:pointer;font-size:13px}
.div-row:hover{background:var(--surface-2)}
.div-track{position:relative;height:16px}
.div-track::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--border-strong)}
.div-fill{position:absolute;top:3px;height:10px}
.div-fill.A{background:var(--grpA);border-radius:4px 0 0 4px}
.div-fill.B{background:var(--grpB);border-radius:0 4px 4px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin:4px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* column chart */
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px;border-bottom:1px solid var(--border-strong)}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1px;height:100%;cursor:pointer;border-radius:4px 4px 0 0;position:relative}
.col:hover{background:var(--surface-2)}
.col .cf{width:70%;max-width:34px;background:var(--grpA);border-radius:4px 4px 0 0;min-height:1px}
.col .cf.B{background:var(--grpB)}
.col.paired .cf{width:38%}
.col-labels{display:flex;gap:3px;font-size:11px;color:var(--text-3)}
.col-labels span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;border-bottom:1px solid var(--border-strong);padding:5px 8px;position:sticky;top:0;background:var(--surface);cursor:pointer;white-space:nowrap}
table.t td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
.tscroll{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px}

/* heatmap matrix */
.matrix{overflow:auto;max-height:560px}
.matrix table{border-collapse:separate;border-spacing:2px;font-size:12px}
.matrix th{font-weight:500;color:var(--text-2);padding:2px 6px;white-space:nowrap;text-align:right;position:sticky;left:0;background:var(--surface);z-index:1}
.matrix thead th{position:sticky;top:0;text-align:left;writing-mode:vertical-rl;transform:rotate(180deg);height:120px;vertical-align:bottom;z-index:2}
.matrix thead th:first-child{writing-mode:horizontal-tb;transform:none;left:0;z-index:3}
.matrix td{width:34px;min-width:34px;height:24px;text-align:center;border-radius:3px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:11px}
.matrix td:hover{outline:2px solid var(--text)}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:6px}
.scale .ramp{display:flex;height:8px;width:140px;border-radius:3px;overflow:hidden}
.scale .ramp i{flex:1}

/* term chips in records */
.tchips{display:flex;flex-wrap:wrap;gap:4px}
.tchip{font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;white-space:nowrap}
.tchip:hover{border-color:var(--accent)}
.tchip.other{border-style:dashed}
.tchip.hit{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:0 6px;border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap}
.badge.warn{border-color:var(--warn);color:var(--warn)} .badge.bad{border-color:var(--bad);color:var(--bad)} .badge.good{border-color:var(--good);color:var(--good)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* records grid */
.rec-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.rec:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.rec .thumb{aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.rec .thumb img{width:100%;height:100%;object-fit:cover}
.rec .body{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.rec .ttl{font-size:13px;font-weight:550;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec .meta{font-size:12px;color:var(--text-3)}
.rec-list .rec{flex-direction:row}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-list .rec .thumb{width:120px;flex:none;aspect-ratio:auto}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.strip .s-i{aspect-ratio:1;background:var(--surface-2);border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid var(--border);position:relative}
.strip .s-i img{width:100%;height:100%;object-fit:cover}
.strip .s-i span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thumb-slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb-slot img{width:100%;height:100%;object-fit:cover}
.thumb-load{border:1px dashed var(--border-strong);background:var(--surface);color:var(--text-2);border-radius:6px;padding:4px 8px;font-size:11.5px;cursor:pointer;line-height:1.25;max-width:88%}
.thumb-load:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.thumb-load::before{content:"🖼 ";}
.thumb-none{font-size:11px;color:var(--text-3)}
/* drawer */
.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);z-index:51;display:flex;flex-direction:column}
.drawer-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.drawer-head .kind{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
.drawer-head h2{margin:0;font-size:18px;font-weight:650;word-break:break-word}
.drawer-head .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.drawer-crumbs{font-size:12px;color:var(--text-3);padding:6px 16px 0;display:flex;gap:4px;flex-wrap:wrap}
.drawer-crumbs a{cursor:pointer;text-decoration:none}
.drawer-body{padding:12px 16px 40px;overflow:auto;flex:1}
.drawer-body h3{font-size:13px;margin:18px 0 6px;font-weight:620}
.drawer-body .kpis{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.imgbox{position:relative;background:var(--surface-2);border-radius:8px;overflow:hidden;line-height:0}
.imgbox img{width:100%;height:auto;display:block}
.imgbox svg{position:absolute;inset:0;width:100%;height:100%}
.imgbox .noimg{line-height:1.5;padding:40px;text-align:center;color:var(--text-3)}
.det-list{font-size:13px}
.det-list .d{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:4px 6px;border-radius:5px;align-items:baseline}
.det-list .d:hover,.det-list .d.hl{background:var(--accent-soft)}
.det-list .d .r{grid-column:2/4;font-size:12px;color:var(--text-3)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13px}
.kv dt{color:var(--text-3)} .kv dd{margin:0;word-break:break-word}
pre.trans{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;margin:0;max-height:260px;overflow:auto}
pre.trans mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px}

/* spatial */
.heat-wrap{display:flex;gap:14px;flex-wrap:wrap}
.heat{display:flex;flex-direction:column;gap:4px}
.heat canvas{width:220px;height:220px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2)}
.heat .cap{font-size:12px;color:var(--text-2)}
.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:180px}
.regions div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:3px;font-variant-numeric:tabular-nums}

/* svg charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--text-3);font-size:11px;font-family:var(--sans)}
svg.chart .grid line{stroke:var(--border)}
svg.chart .axis line{stroke:var(--border-strong)}
svg.chart .hit{fill:transparent;cursor:pointer}

/* load screen */
.load{max-width:880px;margin:40px auto;padding:0 20px}
.load h1{font-size:26px;margin:0 0 6px}
.load p.lead{color:var(--text-2);margin:0 0 22px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.drops{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--border-strong);border-radius:12px;padding:26px 18px;text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .t{font-weight:600} .drop .d{font-size:13px;color:var(--text-3)}
.drop.ok{border-style:solid;border-color:var(--good)}
.load-steps{margin-top:22px;font-size:13px;color:var(--text-2)}
.load-steps li{margin:3px 0}

/* modal */

    { ctrls: seg("vocabKind", [["all", "All"], ["ctrl", "Controlled"], ["other", "Free text"]]) + seg("vocabMetric", [["rows", "% records"], ["dets", "Detections"]]), more: `<p class="sub">All ${pool.length} terms – click a column header to sort.</p>` + fullTable });

  return `<div class="mgroup" style="font-size:12px;color:var(--text-3);font-weight:600"><span>Spellings found (records)</span><span>Standard name</span></div>` + gs.map(g => `<div class="mgroup"><div class="vars">${[...g.variants.entries()].map(([v, n]) => `${esc(v)} <b>(${n})</b>`).join("<br>")}</div><input data-mkey="${esc(g.key)}" value="${esc(g.canonical)}"></div>`).join("");
}
function applyPrepare() {
  const s = state.settings;
  s.minN = Math.max(1, parseInt($("sMinN").value) || 5); s.termKey = $("sTermKey").value; s.include = $("sInclude").value; s.yearSource = $("sYear").value; s.makerSource = $("sMaker").value;
  document.querySelectorAll("#prepList input[data-mkey]").forEach(i => { const g = state.idx.makerGroups.get(i.dataset.mkey); const v = i.value.trim(); if (!g || !v) return; if (v !== g.suggested) state.makerOverrides[g.key] = v; else delete state.makerOverrides[g.key]; });
  lsSet("vew13.settings", s); lsSet("vew13.makers", state.makerOverrides);
  $("modalRoot").innerHTML = ""; rebuild(); invalidate(); state.local.trendTerms = []; state.local.trendInit = false; state.local.compTerm = ""; renderAll(); toast("Settings applied");
}

// ════════════════════════════════════════════════════════════════════
//  Rendering & events
// ════════════════════════════════════════════════════════════════════
function renderAll() { if (!state.A) return renderLoad(); renderLanes(); renderTabs(); renderMain(); renderDrawer(); writeHash(); }
function renderMain() {
  const views = { overview: viewOverview, vocab: viewVocab, people: viewPeople, composition: viewComposition, text: viewText, qa: viewQA, runs: viewRuns, records: viewRecords };
  let h;
  try { h = (views[state.tab] || viewOverview)(); } catch (e) { console.error(e); h = `<div class="notice">Something went wrong rendering this view: ${esc(e.message)}</div>`; }
  if (!ctx().A.length && state.tab !== "runs") h = `<div class="notice">No records match the current filters. <a href="#" data-act="clearAll">Clear filters</a></div>` + (state.tab === "records" ? "" : "");
  const dl = `<datalist id="termList">${[...state.idx.keyCounts.entries()].sort((a, b) => b[1].n - a[1].n).map(([k]) => `<option value="${esc(k)}">`).join("")}</datalist>`;
  $("main").innerHTML = h + dl;
  if (state.tab === "composition" && pendingHeat) document.querySelectorAll("canvas[data-heat]").forEach(cv => { const t = cv.dataset.heat; drawHeat(cv, pendingHeat[t[0]] || [], t.slice(1)); });
  bindViewInputs();
}
function bindViewInputs() {
  const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };
  on("recSort", "change", e => { state.local.recSort = e.target.value; state.local.recPage = 1; renderMain(); });
  on("projN", "change", e => { state.local.projN = Math.max(1, parseInt(e.target.value) || 1); renderMain(); });
  on("trendAdd", "change", e => { const v = e.target.value.trim(); if (v && state.idx.keyCounts.has(v)) { const L = state.local; if (state.mode === "compare") L.trendTerms = [v]; else if (!L.trendTerms.includes(v)) L.trendTerms = L.trendTerms.concat(v).slice(-4); renderMain(); } });
  on("compPick", "change", e => { const v = e.target.value.trim(); if (state.idx.keyCounts.has(v)) { state.local.compTerm = v; renderMain(); } });
  on("pairA", "change", e => { state.local.pairA = e.target.value.trim(); renderMain(); });
  on("pairB", "change", e => { state.local.pairB = e.target.value.trim(); renderMain(); });
}
function handleAct(parts, ev) {
  const [cmd, ...rest] = parts.map(dec);
  const L = state.local;
  switch (cmd) {
    case "open": if (ev && (ev.altKey || ev.shiftKey) && ["term", "maker", "decade", "folder"].includes(rest[0])) return addFilter({ term: "terms", maker: "makers", decade: "decades", folder: "folders" }[rest[0]], rest[1]); return pushDrawer(rest[0], rest[1]);
    case "thumb": return loadThumb(rest[0]);
    case "openrun": L.recDrawerRun = "A"; return pushDrawer("run", rest[0]);
    case "tab": state.tab = rest[0]; closeDrawerSilently(); window.scrollTo(0, 0); return renderAll();
    case "local": L[rest[0]] = rest[1]; if (rest[0] === "recLane" || rest[0] === "recView") L.recPage = 1; if (rest[0] === "recDrawerRun") return renderDrawer(); return renderMain();
    case "filter": return addFilter(rest[0], rest[1]);
    case "rmf": return removeFilter(rest[0], rest[1], rest[2]);
    case "lane": state.lane = rest[0]; return renderLanes();
    case "dclose": return closeDrawer();
    case "dback": state.drawer.pop(); renderDrawer(); return writeHash();
    case "crumb": state.drawer = state.drawer.slice(0, +rest[0] + 1); renderDrawer(); return writeHash();
    case "dfilter": state.drawer = []; return addFilter(rest[0], rest[1]);
    case "drecords": state.drawer = []; state.tab = "records"; return addFilter(rest[0], rest[1]);
    case "dsubset": case "dsubsetrec": { const f = JSON.parse(rest[0]); state.filters[state.lane] = mergeF(state.filters[state.lane], f); state.drawer = []; if (cmd === "dsubsetrec") state.tab = "records"; L.recPage = 1; invalidate(); return renderAll(); }
    case "trendrm": L.trendTerms = L.trendTerms.filter(k => k !== rest[0]); return renderMain();
    case "trendset": if (state.mode === "compare") L.trendTerms = [rest[0]]; else if (!L.trendTerms.includes(rest[0])) L.trendTerms = L.trendTerms.concat(rest[0]).slice(-4); return renderMain();
    case "compset": L.compTerm = rest[0]; renderMain(); return window.scrollTo({ top: 0, behavior: "smooth" });
    case "more": L.recPage++; return renderMain();
    case "exportRows": return exportRows();
    case "prepare": return openPrepare();
    case "mclose": $("modalRoot").innerHTML = ""; return;
    case "mclose-bg": if (ev && ev.target.classList.contains("modal-back")) $("modalRoot").innerHTML = ""; return;
    case "mapply": return applyPrepare();
    case "mreset": state.makerOverrides = {}; state.idx.makerGroups.forEach(g => g.canonical = g.suggested); $("prepList").innerHTML = prepList(); return;
    case "mexport": { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(state.makerOverrides, null, 2)], { type: "application/json" })); a.download = "maker_mapping.json"; a.click(); return; }
    case "mimport": { const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.onchange = () => { const fr = new FileReader(); fr.onload = () => { try { Object.assign(state.makerOverrides, JSON.parse(fr.result)); state.idx.makerGroups.forEach(g => g.canonical = state.makerOverrides[g.key] || g.suggested); $("prepList").innerHTML = prepList(); toast("Mapping imported – click Apply"); } catch (e) { toast("Could not read that file"); } }; fr.readAsText(i.files[0]); }; i.click(); return; }
    case "clearAll": state.filters = { A: emptyF(), B: emptyF() }; invalidate(); return renderAll();
  }
}
function closeDrawerSilently() { state.drawer = []; }
document.addEventListener("click", ev => {
  const sg = ev.target.closest("[data-sg]"); if (sg) return pickSuggest(+sg.dataset.sg);
  if (!ev.target.closest(".search-wrap")) $("suggest").classList.add("hidden");
  const th = ev.target.closest("table.sortable th"); if (th) return sortTable(th);
  const el = ev.target.closest("[data-act]"); if (!el || !el.dataset.act) return;
  if (el.tagName === "A") ev.preventDefault();
  if (el.dataset.act === "prepare" || el.dataset.act === "exportRows" || el.dataset.act === "more" || el.dataset.act === "dclose" || el.dataset.act === "dback" || el.dataset.act === "mclose" || el.dataset.act === "mclose-bg" || el.dataset.act === "mapply" || el.dataset.act === "mreset" || el.dataset.act === "mexport" || el.dataset.act === "mimport" || el.dataset.act === "clearAll") return handleAct([el.dataset.act], ev);
  handleAct(el.dataset.act.split("|"), ev);
});
function sortTable(th) {
  const table = th.closest("table"), i = +th.dataset.col, tb = table.tBodies[0], dir = th.dataset.dir === "desc" ? "asc" : "desc";
  table.querySelectorAll("th").forEach(x => { delete x.dataset.dir; x.textContent = x.textContent.replace(/ [▲▼]$/, ""); });
  th.dataset.dir = dir; th.textContent += dir === "desc" ? " ▼" : " ▲";
  const rows = [...tb.rows], num = rows.every(r => r.cells[i].dataset.v === "" || !isNaN(parseFloat(r.cells[i].dataset.v)));
  rows.sort((a, b) => { const x = a.cells[i].dataset.v, y = b.cells[i].dataset.v; const c = num ? (parseFloat(x) || 0) - (parseFloat(y) || 0) : x.localeCompare(y); return dir === "desc" ? -c : c; });
  rows.forEach(r => tb.appendChild(r));
}
// tooltips
const tip = $("tip");
document.addEventListener("mouseover", ev => {
  const el = ev.target.closest("[data-tip],[data-tiphtml]");
  if (!el || (!el.dataset.tip && !el.dataset.tiphtml)) { tip.style.display = "none"; }
  else { if (el.dataset.tiphtml) tip.innerHTML = el.dataset.tiphtml; else tip.textContent = el.dataset.tip; tip.style.display = "block"; }
  const det = ev.target.closest("[data-det]"); document.querySelectorAll(".bx.hl").forEach(b => { b.classList.remove("hl"); b.style.zIndex = ""; b.style.outline = ""; });
  if (det) { const b = document.querySelector(`.bx[data-bx="${det.dataset.det}"]`); if (b) { b.classList.add("hl"); b.style.zIndex = 5; b.style.outline = "3px solid #fab219"; } }
});
document.addEventListener("mousemove", ev => { if (tip.style.display === "block") { const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = ev.clientY + 16 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 16; tip.style.left = x + "px"; tip.style.top = y + "px"; } });
document.addEventListener("change", ev => { if (ev.target.id === "lblToggle") $("imgbox").style.setProperty("--lbl", ev.target.checked ? "inline" : "none"); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { if ($("modalRoot") && $("modalRoot").innerHTML) $("modalRoot").innerHTML = ""; else if (state.drawer.length) closeDrawer(); } });

// top-bar & filter-bar wiring
$("themeBtn").addEventListener("click", () => { const next = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = next; lsSet("vew13.theme", next); if (state.A) { renderMain(); renderDrawer(); } });
(() => { const t = lsGet("vew13.theme", null); if (t) document.documentElement.dataset.theme = t; })();
document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", () => { state.mode = b.dataset.mode; state.lane = state.mode === "compare" ? "B" : "A"; document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b)); if (state.mode === "compare") state.local.trendTerms = state.local.trendTerms.slice(0, 1); invalidate(); renderAll(); }));
$("prepareBtn").addEventListener("click", openPrepare);
$("loadBtn").addEventListener("click", () => { state.A = null; state.B = null; state.drawer = []; renderLoad(); });
$("clearFilters").addEventListener("click", () => { state.filters = { A: emptyF(), B: emptyF() }; invalidate(); renderAll(); });
[["fDecade", "decades"], ["fFolder", "folders"], ["fOrient", "orient"], ["fValid", "valid"]].forEach(([id, field]) => $(id).addEventListener("change", e => { const v = e.target.value; e.target.value = ""; if (v) addFilter(field, v); }));
$("searchInput").addEventListener("input", renderSuggest);
$("searchInput").addEventListener("focus", renderSuggest);
$("searchInput").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { sgAct = Math.min(sgItems.length - 1, sgAct + 1); hlSuggest(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sgAct = Math.max(0, sgAct - 1); hlSuggest(); e.preventDefault(); }
  else if (e.key === "Enter") { pickSuggest(sgAct); e.preventDefault(); }
  else if (e.key === "Escape") $("suggest").classList.add("hidden");
});

// ── URL hash (bookmarkable views) ─────────────────────────────────
function writeHash() {
  if (!state.A) return;
  const s = { t: state.tab, m: state.mode, f: state.filters, d: state.drawer.slice(-1)[0] || null };
  try { history.replaceState(null, "", "#" + enc(JSON.stringify(s))); } catch (e) {}
}
function readHash() {
  try { const s = JSON.parse(dec(location.hash.slice(1))); if (!s) return; state.tab = s.t || "overview"; state.mode = s.m || "single"; if (s.f) state.filters = { A: Object.assign(emptyF(), s.f.A), B: Object.assign(emptyF(), s.f.B) }; state.drawer = s.d ? [s.d] : []; document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x.dataset.mode === state.mode)); state.lane = state.mode === "compare" ? "B" : "A"; } catch (e) {}
}

// ════════════════════════════════════════════════════════════════════
//  Loading
// ════════════════════════════════════════════════════════════════════
const pending = { A: null, B: null };
function renderLoad() {
  ["filterbar", "tabs", "modeSeg", "prepareBtn", "loadBtn", "datasetPill"].forEach(id => $(id).classList.add("hidden"));
  $("main").innerHTML = `<div class="load"><h1>Load your extraction output</h1><p class="lead">Drop the spreadsheet exported by the visual-elements pipeline. Everything is processed locally in your browser – nothing is uploaded.</p>
  <div class="drops">
    <div class="drop ${pending.A ? "ok" : ""}" id="dropA"><div class="t">${pending.A ? "✓ " + esc(pending.A.name) : "File A · main dataset"}</div><div class="d">${pending.A ? fmtN(pending.A.rows.length) + " processed records" : "Required · .xlsx or .csv · click or drop"}</div></div>
    <div class="drop ${pending.B ? "ok" : ""}" id="dropB"><div class="t">${pending.B ? "✓ " + esc(pending.B.name) : "File B · second run (optional)"}</div><div class="d">${pending.B ? fmtN(pending.B.rows.length) + " processed records" : "Another model / prompt run of the same images, to compare runs"}</div></div>
  </div>
  <div style="margin-top:16px;display:flex;gap:10px"><button class="btn primary" id="startBtn" ${pending.A ? "" : "disabled"}>Open workbench</button>${pending.A || pending.B ? `<button class="btn" id="clearLoad">Clear</button>` : ""}</div>
  <ol class="load-steps"><li><b>Overview</b> gives headline figures and surfaced patterns.</li><li>Use the <b>search / filter bar</b> to narrow down to terms, makers, decades or folders – filters apply to every tab.</li><li><b>Click anything</b> (a bar, a cell, a term) to open a side panel with its details; keep clicking to drill down to individual photographs.</li><li>Switch to <b>Compare groups</b> to set up two subgroups and see them side by side.</li></ol></div>`;
  ["A", "B"].forEach(k => {
    const d = $("drop" + k), inp = $("file" + k);
    d.onclick = () => inp.click();
    d.ondragover = e => { e.preventDefault(); d.classList.add("over"); }; d.ondragleave = () => d.classList.remove("over");
    d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0], k); };
    inp.onchange = () => { if (inp.files[0]) readFile(inp.files[0], k); inp.value = ""; };
  });
  $("startBtn").onclick = start;
  if ($("clearLoad")) $("clearLoad").onclick = () => { pending.A = pending.B = null; renderLoad(); };
}
function rowsToDataset(raw, name) {
  const seen = new Set(), rows = [], all = [];
  raw.forEach(x => { const r = normalizeRow(x); if (!r.uid) return; all.push(r); if (!r.processed || seen.has(r.uid)) return; seen.add(r.uid); rows.push(r); });
  if (!all.length) throw new Error("No rows with a uid column were found.");
  return { name, rows, all };
}
function readFile(file, k) {
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]]; const raw = XLSX.utils.sheet_to_json(ws, { defval: null, raw: true });
      pending[k] = rowsToDataset(raw, file.name); renderLoad();
    } catch (err) { console.error(err); toast("Could not read " + file.name + ": " + err.message); }
  };
  fr.readAsArrayBuffer(file);
}
function start() {
  state.A = pending.A; state.B = pending.B;
  rebuild(); invalidate();
  ["filterbar", "tabs", "modeSeg", "prepareBtn", "loadBtn", "datasetPill"].forEach(id => $(id).classList.remove("hidden"));
  $("datasetPill").textContent = `${state.A.name} · ${fmtN(state.A.rows.length)} records${state.B ? ` · vs ${state.B.name}` : ""}`;
  readHash(); if (state.tab === "runs" && !state.B) state.tab = "overview";
  renderAll();
}
window.__vew = { state, handleAct, renderAll, pending, start, normalizeRow };  // for debugging in the console
renderLoad();
// Data Hub: load the published visual-elements data as File A and open the
// workbench straight away. "Load files" still lets you add your own A/B files.
HubData.autoload("visual_table", raw => {
  if (state.A) return;                       // someone already loaded a file manually
  pending.A = rowsToDataset(raw, "Data Hub · visual elements");
  start();
}, { label: "visual-element data" });
})();
</script>
